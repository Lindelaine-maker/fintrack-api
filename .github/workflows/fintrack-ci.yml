name: FinTrack CI

on:
  pull_request:
    branches: [main]
    paths:
      - "FinTrack-Projeto-Completo/fintrack/**"
      - ".github/workflows/fintrack-ci.yml"
  push:
    branches: [main, "review/**"]
    paths:
      - "FinTrack-Projeto-Completo/fintrack/**"
      - ".github/workflows/fintrack-ci.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build e testes de integração (Java 17)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FinTrack-Projeto-Completo/fintrack
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: FinTrack-Projeto-Completo/fintrack/pom.xml
      - name: Compilar e executar testes
        run: mvn --batch-mode --no-transfer-progress clean verify
