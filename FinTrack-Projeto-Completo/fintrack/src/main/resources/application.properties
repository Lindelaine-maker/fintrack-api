spring.application.name=FinTrack API
server.port=8080
spring.datasource.url=jdbc:h2:file:./data/fintrack;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
app.jwt.secret=${JWT_SECRET:Zm9ydG5pdGUtc2VjcmV0LWtleS1mb3ItZGV2ZWxvcG1lbnQtb25seS0zMi1ieXRlcyE=}
app.jwt.expiration-ms=86400000
springdoc.swagger-ui.path=/swagger-ui.html
